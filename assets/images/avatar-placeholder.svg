<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#bgGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <circle cx="200" cy="200" r="180" fill="#0f172a" />

  <!-- Background decorative tech grid/dots -->
  <circle cx="100" cy="100" r="3" fill="#6366f1" opacity="0.4" />
  <circle cx="300" cy="90" r="3" fill="#38bdf8" opacity="0.5" />
  <circle cx="80" cy="280" r="4" fill="#a855f7" opacity="0.4" />
  <circle cx="320" cy="260" r="3" fill="#3b82f6" opacity="0.5" />

  <!-- Code symbols float -->
  <text x="70" y="140" fill="#6366f1" opacity="0.3" font-family="monospace" font-size="20">&lt;/&gt;</text>
  <text x="310" y="150" fill="#06b6d4" opacity="0.3" font-family="monospace" font-size="20">{ ; }</text>

  <!-- Body / Hoodie -->
  <path d="M 90 380 Q 200 320 310 380 L 310 400 L 90 400 Z" fill="url(#hoodieGrad)" />
  <path d="M 140 330 Q 200 360 260 330 L 260 400 L 140 400 Z" fill="#1e293b" opacity="0.7"/>

  <!-- Neck -->
  <rect x="175" y="240" width="50" height="60" rx="8" fill="#fbcfe8" opacity="0.9" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="190" rx="65" ry="75" fill="url(#faceGrad)" />

  <!-- Hair -->
  <path d="M 130 180 Q 140 100 200 95 Q 260 95 270 170 Q 250 130 200 130 Q 150 130 130 180 Z" fill="url(#hairGrad)" />

  <!-- Stylish Glasses -->
  <rect x="145" y="170" width="45" height="28" rx="6" fill="#0f172a" opacity="0.15" stroke="#38bdf8" stroke-width="3" />
  <rect x="210" y="170" width="45" height="28" rx="6" fill="#0f172a" opacity="0.15" stroke="#38bdf8" stroke-width="3" />
  <line x1="190" y1="184" x2="210" y2="184" stroke="#38bdf8" stroke-width="3" />

  <!-- Eyes behind glasses -->
  <circle cx="168" cy="184" r="5" fill="#1e293b" />
  <circle cx="232" cy="184" r="5" fill="#1e293b" />
  <circle cx="170" cy="182" r="1.5" fill="#ffffff" />
  <circle cx="234" cy="182" r="1.5" fill="#ffffff" />

  <!-- Friendly Smile -->
  <path d="M 185 220 Q 200 235 215 220" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

  <!-- Coding laptop hint at bottom -->
  <rect x="130" y="360" width="140" height="15" rx="3" fill="#64748b" />
  <polygon points="190,364 210,364 205,370 195,370" fill="#38bdf8" />
</svg>
