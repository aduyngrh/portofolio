<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p1bg)" />
  
  <!-- Browser Chrome Header -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="740" height="42" rx="12" fill="#0f172a" />
  <circle cx="55" cy="51" r="6" fill="#ef4444" />
  <circle cx="75" cy="51" r="6" fill="#eab308" />
  <circle cx="95" cy="51" r="6" fill="#22c55e" />
  <rect x="130" y="42" width="400" height="18" rx="6" fill="#1e293b" />
  <text x="145" y="55" fill="#64748b" font-family="sans-serif" font-size="11">https://tokomaju-store.vercel.app</text>

  <!-- Store Header -->
  <rect x="50" y="90" width="700" height="50" rx="8" fill="#0f172a" />
  <text x="75" y="122" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="18">NEXUS COMMERCE</text>
  <rect x="620" y="102" width="110" height="26" rx="6" fill="url(#accentGrad)" />
  <text x="645" y="119" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Cart (3)</text>

  <!-- Hero Promo Banner in Store -->
  <rect x="50" y="155" width="700" height="120" rx="10" fill="url(#accentGrad)" opacity="0.85" />
  <text x="80" y="200" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="24">Super Mega Tech Sale 50% Off</text>
  <text x="80" y="230" fill="#e0e7ff" font-family="sans-serif" font-size="14">Temukan perangkat hardware &amp; gadget terbaik dengan pengiriman kilat</text>

  <!-- Product Cards Grid -->
  <g transform="translate(50, 290)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="160" height="155" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="12" y="12" width="136" height="75" rx="6" fill="#334155" />
    <circle cx="80" cy="50" r="24" fill="#6366f1" opacity="0.6"/>
    <text x="12" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Mechanical Keyboard</text>
    <text x="12" y="125" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 899.000</text>
    <rect x="100" y="110" width="48" height="22" rx="4" fill="#6366f1" />
    <text x="108" y="125" fill="#fff" font-family="sans-serif" font-size="10">+ Beli</text>

    <!-- Card 2 -->
    <rect x="180" y="0" width="160" height="155" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="192" y="12" width="136" height="75" rx="6" fill="#334155" />
    <circle cx="260" cy="50" r="24" fill="#ec4899" opacity="0.6"/>
    <text x="192" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Wireless Headphone</text>
    <text x="192" y="125" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 1.450.000</text>
    <rect x="280" y="110" width="48" height="22" rx="4" fill="#6366f1" />
    <text x="288" y="125" fill="#fff" font-family="sans-serif" font-size="10">+ Beli</text>

    <!-- Card 3 -->
    <rect x="360" y="0" width="160" height="155" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="372" y="12" width="136" height="75" rx="6" fill="#334155" />
    <circle cx="440" cy="50" r="24" fill="#10b981" opacity="0.6"/>
    <text x="372" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Smart Watch Ultra</text>
    <text x="372" y="125" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 2.199.000</text>
    <rect x="460" y="110" width="48" height="22" rx="4" fill="#6366f1" />
    <text x="468" y="125" fill="#fff" font-family="sans-serif" font-size="10">+ Beli</text>

    <!-- Card 4 -->
    <rect x="540" y="0" width="160" height="155" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="552" y="12" width="136" height="75" rx="6" fill="#334155" />
    <circle cx="620" cy="50" r="24" fill="#f59e0b" opacity="0.6"/>
    <text x="552" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Ultra HD Webcam 4K</text>
    <text x="552" y="125" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 750.000</text>
    <rect x="640" y="110" width="48" height="22" rx="4" fill="#6366f1" />
    <text x="648" y="125" fill="#fff" font-family="sans-serif" font-size="10">+ Beli</text>
  </g>
</svg>
