<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p5bg)" />

  <rect x="30" y="30" width="740" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="30" y="30" width="740" height="50" rx="12" fill="#1e293b" />
  <circle cx="65" cy="55" r="10" fill="#a855f7" />
  <text x="88" y="60" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="15">Aura UI - Modern Design System</text>
  <text x="680" y="60" fill="#94a3b8" font-family="monospace" font-size="12">v2.4.0</text>

  <!-- Left component list -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="350" rx="8" fill="#1e293b" />
    <text x="15" y="25" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">COMPONENTS</text>
    <rect x="10" y="40" width="160" height="28" rx="6" fill="#3b82f6" opacity="0.2" />
    <text x="25" y="58" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">Buttons &amp; Badges</text>
    <text x="25" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">Modal Dialogs</text>
    <text x="25" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">Data Tables</text>
    <text x="25" y="150" fill="#94a3b8" font-family="sans-serif" font-size="12">Form Controls</text>
    <text x="25" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Navigation Bars</text>
    <text x="25" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">Toast Alerts</text>
  </g>

  <!-- Component Showcase Area -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="500" height="350" rx="8" fill="#111827" />
    <text x="25" y="35" fill="#f9fafb" font-family="sans-serif" font-weight="bold" font-size="16">Buttons &amp; Interactive Variants</text>
    
    <!-- Button Row 1 -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="100" height="38" rx="8" fill="#6366f1" />
      <text x="24" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Primary</text>

      <rect x="115" y="0" width="100" height="38" rx="8" fill="#06b6d4" />
      <text x="135" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Accent</text>

      <rect x="230" y="0" width="100" height="38" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="255" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Outline</text>

      <rect x="345" y="0" width="100" height="38" rx="8" fill="#ef4444" />
      <text x="368" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Danger</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(25, 120)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#10b981" opacity="0.2" />
      <text x="14" y="16" fill="#34d399" font-family="sans-serif" font-size="11">Active</text>

      <rect x="85" y="0" width="75" height="24" rx="12" fill="#f59e0b" opacity="0.2" />
      <text x="96" y="16" fill="#fbbf24" font-family="sans-serif" font-size="11">Pending</text>

      <rect x="175" y="0" width="85" height="24" rx="12" fill="#6366f1" opacity="0.2" />
      <text x="187" y="16" fill="#a5b4fc" font-family="sans-serif" font-size="11">Verified</text>
    </g>

    <!-- Code Preview Box -->
    <g transform="translate(25, 165)">
      <rect x="0" y="0" width="450" height="160" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="15" y="25" fill="#64748b" font-family="monospace" font-size="11">// React / Tailwind snippet</text>
      <text x="15" y="55" fill="#f43f5e" font-family="monospace" font-size="12">&lt;<tspan fill="#38bdf8">Button</tspan> <tspan fill="#eab308">variant</tspan>=<tspan fill="#34d399">"primary"</tspan> <tspan fill="#eab308">size</tspan>=<tspan fill="#34d399">"lg"</tspan>&gt;</text>
      <text x="35" y="80" fill="#f8fafc" font-family="monospace" font-size="12">Get Started Free</text>
      <text x="15" y="105" fill="#f43f5e" font-family="monospace" font-size="12">&lt;/<tspan fill="#38bdf8">Button</tspan>&gt;</text>
      <rect x="360" y="120" width="75" height="26" rx="4" fill="#1e293b" />
      <text x="375" y="137" fill="#38bdf8" font-family="sans-serif" font-size="11">📋 Copy</text>
    </g>
  </g>
</svg>
