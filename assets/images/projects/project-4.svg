<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p4bg)" />

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(270, 25)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="260" height="450" rx="35" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="95" y="12" width="70" height="18" rx="9" fill="#020617" />
    
    <!-- Phone Screen Content -->
    <g transform="translate(15, 40)">
      <!-- User Greeting -->
      <text x="5" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Saldo Dompet</text>
      <text x="5" y="55" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Rp 48.750.000</text>
      <rect x="180" y="32" width="45" height="22" rx="11" fill="#047857" />
      <text x="188" y="47" fill="#6ee7b7" font-family="sans-serif" font-size="10">+4.2%</text>

      <!-- Debit Card in Phone -->
      <rect x="0" y="75" width="230" height="130" rx="14" fill="url(#cardGrad)" />
      <circle cx="200" cy="100" r="14" fill="#ffffff" opacity="0.3" />
      <circle cx="185" cy="100" r="14" fill="#ffffff" opacity="0.4" />
      <text x="20" y="110" fill="#ecfdf5" font-family="sans-serif" font-size="12">Yudha Card Black</text>
      <text x="20" y="150" fill="#ffffff" font-family="monospace" font-size="14" letter-spacing="2">••••  ••••  ••••  8921</text>
      <text x="20" y="185" fill="#d1fae5" font-family="sans-serif" font-size="10">VALID 12/28</text>

      <!-- Quick Action Buttons -->
      <g transform="translate(0, 220)">
        <circle cx="25" cy="20" r="18" fill="#1e293b" />
        <text x="17" y="25" fill="#34d399" font-family="sans-serif" font-size="14">↑</text>
        <text x="12" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Kirim</text>

        <circle cx="85" cy="20" r="18" fill="#1e293b" />
        <text x="77" y="25" fill="#38bdf8" font-family="sans-serif" font-size="14">↓</text>
        <text x="71" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Terima</text>

        <circle cx="145" cy="20" r="18" fill="#1e293b" />
        <text x="138" y="25" fill="#facc15" font-family="sans-serif" font-size="14">⚡</text>
        <text x="134" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Tagihan</text>

        <circle cx="205" cy="20" r="18" fill="#1e293b" />
        <text x="198" y="25" fill="#a78bfa" font-family="sans-serif" font-size="14">⋯</text>
        <text x="194" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Lainnya</text>
      </g>

      <!-- Recent Transactions -->
      <g transform="translate(0, 285)">
        <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="12">Transaksi Terbaru</text>
        
        <rect x="0" y="25" width="230" height="42" rx="8" fill="#1e293b" />
        <circle cx="22" cy="46" r="12" fill="#047857" />
        <text x="42" y="42" fill="#ffffff" font-family="sans-serif" font-size="11">Transfer Masuk</text>
        <text x="42" y="58" fill="#64748b" font-family="sans-serif" font-size="9">Hari ini, 14:20</text>
        <text x="165" y="48" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">+Rp 2.5jt</text>
      </g>
    </g>
  </g>
</svg>
