<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p2bg)" />
  
  <!-- Outer Window -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Left Sidebar -->
  <rect x="30" y="30" width="160" height="440" rx="12" fill="#0b0f19" />
  <circle cx="60" cy="65" r="12" fill="url(#cyanGrad)" />
  <text x="82" y="70" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="14">Synapse AI</text>
  
  <rect x="45" y="110" width="130" height="32" rx="6" fill="#1f2937" />
  <text x="65" y="131" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">📊 Overview</text>
  <text x="65" y="170" fill="#9ca3af" font-family="sans-serif" font-size="12">⚡ Live Models</text>
  <text x="65" y="210" fill="#9ca3af" font-family="sans-serif" font-size="12">🧠 Token Usage</text>
  <text x="65" y="250" fill="#9ca3af" font-family="sans-serif" font-size="12">🔑 API Keys</text>
  <text x="65" y="290" fill="#9ca3af" font-family="sans-serif" font-size="12">⚙️ Settings</text>

  <!-- Top Navbar in Dashboard -->
  <rect x="190" y="30" width="580" height="55" fill="#111827" />
  <text x="215" y="65" fill="#f9fafb" font-family="sans-serif" font-weight="bold" font-size="16">Platform Intelligence &amp; Metrics</text>
  <circle cx="730" cy="58" r="16" fill="#374151" />
  <circle cx="685" cy="58" r="14" fill="#1f2937" />

  <!-- Metric KPI Cards -->
  <g transform="translate(210, 100)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#1f2937" />
    <text x="15" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">TOTAL INFERENCES</text>
    <text x="15" y="55" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="bold">1.48M</text>
    <text x="100" y="55" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">+18.4%</text>

    <rect x="180" y="0" width="160" height="80" rx="8" fill="#1f2937" />
    <text x="195" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">AVG LATENCY</text>
    <text x="195" y="55" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="bold">42ms</text>
    <text x="280" y="55" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">-12ms</text>

    <rect x="360" y="0" width="160" height="80" rx="8" fill="#1f2937" />
    <text x="375" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11">ACCURACY SCORE</text>
    <text x="375" y="55" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="bold">99.4%</text>
    <text x="460" y="55" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Stable</text>
  </g>

  <!-- Big Interactive Area Chart -->
  <g transform="translate(210, 200)">
    <rect x="0" y="0" width="340" height="245" rx="8" fill="#1f2937" />
    <text x="20" y="30" fill="#f9fafb" font-family="sans-serif" font-size="13" font-weight="bold">Traffic &amp; Request Volume</text>
    
    <!-- Chart axes & grid lines -->
    <line x1="20" y1="200" x2="320" y2="200" stroke="#374151" stroke-width="1" />
    <line x1="20" y1="150" x2="320" y2="150" stroke="#374151" stroke-dasharray="3,3" />
    <line x1="20" y1="100" x2="320" y2="100" stroke="#374151" stroke-dasharray="3,3" />
    <line x1="20" y1="50" x2="320" y2="50" stroke="#374151" stroke-dasharray="3,3" />

    <!-- Wave Area -->
    <path d="M 20 180 Q 70 90 120 130 T 220 80 T 320 60 L 320 200 L 20 200 Z" fill="url(#chartGrad)" />
    <path d="M 20 180 Q 70 90 120 130 T 220 80 T 320 60" fill="none" stroke="#06b6d4" stroke-width="3" />
  </g>

  <!-- Side Gauge / Donut Distribution -->
  <g transform="translate(570, 200)">
    <rect x="0" y="0" width="160" height="245" rx="8" fill="#1f2937" />
    <text x="15" y="30" fill="#f9fafb" font-family="sans-serif" font-size="13" font-weight="bold">Model Split</text>
    
    <!-- Donut Circle -->
    <circle cx="80" cy="115" r="45" fill="none" stroke="#374151" stroke-width="14" />
    <circle cx="80" cy="115" r="45" fill="none" stroke="#6366f1" stroke-width="14" stroke-dasharray="160, 280" stroke-dashoffset="40" />
    <circle cx="80" cy="115" r="45" fill="none" stroke="#06b6d4" stroke-width="14" stroke-dasharray="80, 280" stroke-dashoffset="200" />
    
    <text x="20" y="190" fill="#818cf8" font-family="sans-serif" font-size="11">● GPT-4 / Claude (62%)</text>
    <text x="20" y="215" fill="#38bdf8" font-family="sans-serif" font-size="11">● Custom LLM (38%)</text>
  </g>
</svg>
