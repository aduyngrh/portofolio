<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p6bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p6bg)" />
  
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="30" y="30" width="740" height="55" rx="12" fill="#18181b" />
  <circle cx="65" cy="58" r="14" fill="url(#orangeGrad)" />
  <text x="90" y="63" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">FitPulse Web App</text>
  <text x="650" y="63" fill="#f97316" font-family="sans-serif" font-size="13">🔥 14 Hari Streak</text>

  <!-- Calorie & Activity Rings -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="330" rx="10" fill="#18181b" />
    <text x="25" y="35" fill="#fafafa" font-family="sans-serif" font-weight="bold" font-size="15">Aktivitas Hari Ini</text>
    
    <!-- Big Ring 1: Move -->
    <circle cx="155" cy="170" r="85" fill="none" stroke="#27272a" stroke-width="16" />
    <circle cx="155" cy="170" r="85" fill="none" stroke="#ef4444" stroke-width="16" stroke-dasharray="420, 534" stroke-linecap="round" />
    
    <!-- Ring 2: Exercise -->
    <circle cx="155" cy="170" r="62" fill="none" stroke="#27272a" stroke-width="16" />
    <circle cx="155" cy="170" r="62" fill="none" stroke="#22c55e" stroke-width="16" stroke-dasharray="310, 390" stroke-linecap="round" />

    <!-- Ring 3: Stand -->
    <circle cx="155" cy="170" r="39" fill="none" stroke="#27272a" stroke-width="16" />
    <circle cx="155" cy="170" r="39" fill="none" stroke="#06b6d4" stroke-width="16" stroke-dasharray="190, 245" stroke-linecap="round" />

    <text x="40" y="300" fill="#f87171" font-family="sans-serif" font-size="12">● 680 Kkal</text>
    <text x="130" y="300" fill="#4ade80" font-family="sans-serif" font-size="12">● 45 Menit</text>
    <text x="220" y="300" fill="#38bdf8" font-family="sans-serif" font-size="12">● 10 Jam</text>
  </g>

  <!-- Workout History Cards -->
  <g transform="translate(390, 110)">
    <rect x="0" y="0" width="350" height="330" rx="10" fill="#18181b" />
    <text x="25" y="35" fill="#fafafa" font-family="sans-serif" font-weight="bold" font-size="15">Riwayat Latihan</text>

    <!-- Workout 1 -->
    <rect x="20" y="55" width="310" height="70" rx="8" fill="#27272a" />
    <circle cx="55" cy="90" r="20" fill="#ef4444" opacity="0.2" />
    <text x="47" y="96" fill="#ef4444" font-family="sans-serif" font-size="18">🏃</text>
    <text x="90" y="80" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Lari Pagi Outdoor</text>
    <text x="90" y="102" fill="#a1a1aa" font-family="sans-serif" font-size="11">5.2 km • 28 Menit • 340 Kkal</text>

    <!-- Workout 2 -->
    <rect x="20" y="140" width="310" height="70" rx="8" fill="#27272a" />
    <circle cx="55" cy="175" r="20" fill="#3b82f6" opacity="0.2" />
    <text x="47" y="181" fill="#3b82f6" font-family="sans-serif" font-size="18">🏋️</text>
    <text x="90" y="165" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Latihan Beban (Chest &amp; Triceps)</text>
    <text x="90" y="187" fill="#a1a1aa" font-family="sans-serif" font-size="11">4 Set • 45 Menit • 280 Kkal</text>

    <!-- Workout 3 -->
    <rect x="20" y="225" width="310" height="70" rx="8" fill="#27272a" />
    <circle cx="55" cy="260" r="20" fill="#10b981" opacity="0.2" />
    <text x="47" y="266" fill="#10b981" font-family="sans-serif" font-size="18">🧘</text>
    <text x="90" y="250" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Yoga &amp; Stretching</text>
    <text x="90" y="272" fill="#a1a1aa" font-family="sans-serif" font-size="11">Sesi Relaksasi • 20 Menit</text>
  </g>
</svg>
